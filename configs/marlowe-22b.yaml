# Marlowe-22B: 12 cuts from Qwen3.8-27B.
#
#   26.8961 B - 12 x 383.279 M = 22.2968 B, 52 layers (36 linear + 16 attention)
#
# Ships at IQ3_M (~3.66 bpw, ~10.2 GB) or the best custom mix from Stage 0, whichever
# measures better. This rung ships independently and first.

name: marlowe-22b
parent: Qwen/Qwen3.8-27B
n_cuts: 12
run_dir: runs/marlowe-22b

# Layout constraints. Derived period structure; these are the caps applied to it.
max_per_period: 2          # every period keeps >= 1 linear layer
protect_first_periods: 1
protect_last_periods: 1

drop_vision: true          # -0.46 B, and removes multimodal data from the healing requirement
drop_mtp: true             # -0.38 B, and the draft head is invalid after pruning anyway

expected_params: 22.2968
expected_layers: 52

score:
  mode: oneshot            # ~172 forward passes vs ~2200 for greedy-with-rescoring
  seq_len: 32768           # rule 3.2: short calibration nominates the layers you must not cut
  n_seqs: 4
  n_positions: 512
  position_start_frac: 0.25   # sample only the last three quarters
  seed: 0
  calib_path: data/calib.jsonl
  load_in_4bit: true
  run_positional_control: true

teacher:
  tokens: 50000000
  top_k: 16
  seq_len: 2048
  batch_size: 4
  corpus_path: data/heal_corpus.jsonl
  shard_tokens: 5000000

heal:
  # Sized to make the 18B rung reachable, not to maximise 22B on its own. 22B ships, but it
  # is the intermediate: a direct 27B -> 18B cut is outside the band where healing recovers,
  # and this rung exists to keep each step near 19%.
  tokens: 50000000
  seq_len: 2048            # what makes 3 days possible; verify at 128K before shipping
  lora_rank: 32
  lora_alpha: 64
  learning_rate: 0.0001
  warmup_steps: 200
  grad_accum: 16
  micro_batch: 1
  gradient_checkpointing: true
  checkpoint_every_tokens: 10000000
  kl_plateau_delta: 0.002
  long_context_tokens: 0        # set to 5000000 if needle @128K regresses (section 7 fallback)
  long_context_seq_len: 16384

repetition:
  n_completions: 200
  max_tokens: 2048
  ngram_sizes: [8, 32]
  prompts_path: data/circling_prompts.jsonl
  # llama-server batches concurrent sequences and each completion is independently
  # seeded, so this is pure throughput: the harness is 410K tokens per variant and
  # Stage 0 runs it once per quant recipe. 4 slots x 8192 ctx of Q8 KV is ~1.1 GB on
  # top of a ~10 GB model, which fits the 16 GB card.
  parallel: 4
  preset: thinking         # never non_thinking: presence_penalty 1.5 masks the artefact
  seed: 0

ship:
  max_kl_vs_baseline: iq3_xxs   # must be strictly below the user's current build
  max_repetition_vs: bf16       # must be at or below bf16

# Empty = quantize.ship_recipes(): every gated bit-width (Q4_K_M, IQ4_XS, IQ3_M) plus the
# gate/recurrent-protected mix. The ship gate requires ALL THREE to pass.
quants: []
